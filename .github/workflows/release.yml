name: Release

# Builds the Windows installer (.msi/.exe) and attaches it to a draft GitHub
# Release. macOS builds are NOT done here — build those locally on your Mac
# with `npm run tauri build` — faster than a runner, and the signing certificate
# lives in that machine's keychain anyway. Windows is the one
# platform you don't have a machine for, so that's the only one CI builds.
#
# Only triggers on a version tag or manual dispatch, never on every push. Not for billing
# reasons: this repository is public, and Actions is free without a minute limit on public
# repositories, so these builds cost nothing and take nothing from the private repos on the
# same account. (That was not true while this repo was private, which is what the note here
# used to say.) The trigger stays narrow because a twelve-minute Windows build on every push
# is noise — the only concurrency the account really shares is the cap on simultaneous jobs.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest

    # Creating the release and uploading the installers to it is a write to the
    # repository, and the default GITHUB_TOKEN is read-only. Without this the whole
    # job builds successfully and then dies on the last step with "Resource not
    # accessible by integration", which reads like a broken build rather than a
    # missing scope.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Empty on a manual run. `github.ref_name` is the branch there, not a version, so
          # passing it through would publish a draft release called "main" every time someone
          # tests a build. tauri-action only creates a release when it is given a tag name, so
          # leaving these blank makes a dispatch build and stop — the step below keeps the
          # installers as artifacts instead.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('Capture Studio {0}', github.ref_name) || '' }}
          releaseBody: "See CHANGELOG or commit history for details. macOS build: run `npm run tauri build` locally and attach the .dmg to this release."
          releaseDraft: true
          prerelease: false

      # Only for manual runs: a tagged run has already attached these to the release.
      - name: Keep the installers from a test build
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
