name: Release

# Builds the Windows installer (.msi/.exe) and attaches it to a draft GitHub
# Release. macOS builds are NOT done here — build those locally on your Mac
# with `npm run tauri build` (faster, and free — no need to burn Actions
# minutes on a runner you already have on your desk). Windows is the one
# platform you don't have a machine for, so that's the only one CI builds.
#
# Only triggers on a version tag or manual dispatch — never on every push —
# since that Actions-minute quota is shared across all your repos (including
# AltaVn).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Capture Studio ${{ github.ref_name }}"
          releaseBody: "See CHANGELOG or commit history for details. macOS build: run `npm run tauri build` locally and attach the .dmg to this release."
          releaseDraft: true
          prerelease: false
